[workspace]
resolver = "2"
members = [
    "crates/berthos-protocol",
    "crates/berthos-node",
    "crates/berthos-mcp",
    "crates/berthos-adapter-anthropic",
    "crates/berthos-adapter-openai",
    "crates/berthos-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/codeitlikemiley/berth"
readme = "README.md"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
