[package]
name = "berth-adapter-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Anthropic computer_toolset adapter"

[dependencies]
base64 = "0.22"
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
serde_json = "1"
