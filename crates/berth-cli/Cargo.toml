[package]
name = "berth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Berth command-line interface"

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
berth-node = { version = "0.1.0", path = "../berth-node" }
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
clap.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
httptest = "0.16"
tempfile = "3"
