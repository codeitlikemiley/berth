[package]
name = "berthos-adapter-anthropic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Anthropic computer_toolset adapter"

[dependencies]
base64 = "0.22"
berthos-protocol = { version = "0.1.0", path = "../berthos-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
berthos-protocol = { version = "0.1.0", path = "../berthos-protocol" }
serde_json = "1"
