[package]
name = "berth-adapter-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenAI Responses computer-use adapter"

[dependencies]
base64 = "0.22"
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
berth-node = { version = "0.1.0", path = "../berth-node" }
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
