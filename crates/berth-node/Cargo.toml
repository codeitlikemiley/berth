[package]
name = "berth-node"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Berth node daemon"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
berth-protocol = { path = "../berth-protocol" }
bollard = "0.21"
futures-util = "0.3"
getrandom = "0.4.3"
mime_guess = "2"
# Local ledger; sqlx compile-time checks are heavier than this sqlite file.
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8", features = ["debug-embed", "interpolate-folder-path"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "io-util", "process"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1"
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5.3", features = ["util"] }
