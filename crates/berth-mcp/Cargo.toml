[package]
name = "berth-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Berth MCP stdio server"

[dependencies]
base64 = "0.22"
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util", "io-std"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
toml = "0.8"

[dev-dependencies]
berth-protocol = { version = "0.1.0", path = "../berth-protocol" }
futures-util = "0.3"
httptest = "0.16"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
