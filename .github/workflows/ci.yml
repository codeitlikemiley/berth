name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Build console
        working-directory: apps/console
        run: npm ci && npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # The egress guarantee lives in the guest image's entrypoint, not in Rust, so
  # the Rust job above cannot see it regress. Build the real image and assert
  # what it actually does to traffic.
  guest-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build guest image
        run: docker build -t berthos-linux-xfce:ci images/linux-xfce

      - name: Egress filter holds
        run: ./images/linux-xfce/test-egress.sh berthos-linux-xfce:ci
