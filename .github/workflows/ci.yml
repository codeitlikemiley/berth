name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Build console
        working-directory: apps/console
        run: npm ci && npm run build

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  # Every console bug this repo has shipped passed the unit suite: a dialog that
  # blocked the event loop, a label that claimed forfeiture over live income, a
  # health panel that never re-read. Those are behaviours on a page, so assert
  # them in a real browser against the production bundle.
  console-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/console/package-lock.json

      - name: Install deps
        working-directory: apps/console
        run: npm ci

      - name: Install Chromium
        working-directory: apps/console
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: apps/console
        run: npm run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/console/playwright-report/
          retention-days: 7

  # The egress guarantee lives in the guest image's entrypoint, not in Rust, so
  # the Rust job above cannot see it regress. Build the real image and assert
  # what it actually does to traffic.
  guest-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build guest image
        run: docker build -t berthos-linux-xfce:ci images/linux-xfce

      - name: Egress filter holds
        run: ./images/linux-xfce/test-egress.sh berthos-linux-xfce:ci

      # These exist in the repo but are #[ignore]d, so they have never actually
      # run anywhere. One of them was silently broken. This job is the only one
      # with a guest image to run them against.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Guest driver e2e
        env:
          BERTH_E2E: "1"
          BERTH_IMAGE: berthos-linux-xfce:ci
        run: cargo test -p berth-node --test e2e_docker -- --ignored

      # An adapter that maps cleanly but emits actions the guest refuses is the
      # failure this catches; it is how drag and hold_key stayed broken.
      - name: Adapter e2e
        env:
          BERTH_E2E: "1"
          BERTH_IMAGE: berthos-linux-xfce:ci
        run: cargo test -p berth-adapter-openai --test e2e_guest -- --ignored
